# Phase: Phase 15B CLI, distribution, and quality hardening

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Run checks and coverage
        run: npm run check && npm run coverage

  executables:
    name: Build macOS ${{ matrix.architecture }}
    needs: checks
    strategy:
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build executable
        run: npm run build:executable

      - name: Smoke-test executable
        run: npm run smoke:executable -- "artifacts/vulci-${GITHUB_REF_NAME#v}-macos-${{ matrix.architecture }}"

      - name: Generate checksum
        working-directory: artifacts
        run: shasum -a 256 "vulci-${GITHUB_REF_NAME#v}-macos-${{ matrix.architecture }}" > "vulci-${GITHUB_REF_NAME#v}-macos-${{ matrix.architecture }}.sha256"

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: vulci-macos-${{ matrix.architecture }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: vulci-macos-*
          path: artifacts
          merge-multiple: true

      - name: Verify checksums
        working-directory: artifacts
        run: shasum -a 256 --check *.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "Vulci ${GITHUB_REF_NAME#v}"

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vulci
        uses: actions/checkout@v7
        with:
          path: source

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: TimVdWalle/homebrew-vulci
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download executable artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: vulci-macos-*
          path: artifacts
          merge-multiple: true

      - name: Generate formula
        run: node source/scripts/generate-homebrew-formula.mjs tap "$GITHUB_REPOSITORY" "${GITHUB_REF_NAME#v}" artifacts/vulci-${GITHUB_REF_NAME#v}-macos-arm64.sha256 artifacts/vulci-${GITHUB_REF_NAME#v}-macos-x64.sha256

      - name: Publish formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vulci.rb
          git diff --cached --quiet || git commit -m "Update Vulci to ${GITHUB_REF_NAME#v}"
          git push
