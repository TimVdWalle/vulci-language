# Phase: Phase 15B CLI, distribution, and quality hardening

name: Checks
run-name: ${{ inputs.release_run && format('Checks for release {0}', inputs.release_run) || 'Checks' }}

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Internal identifier for an automated release check
        required: false
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run formatting, linting, type checks, and tests
        run: npm run check

      - name: Run coverage
        shell: bash
        run: |
          set +e
          npm run coverage 2>&1 | tee coverage.txt
          coverage_status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Test coverage"
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$coverage_status"
